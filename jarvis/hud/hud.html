<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>
<style>
  :root { --cian: #4fd8ff; --fondo: #02070d; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; color: var(--cian); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  /* Flotando sobre el escritorio: sin texto, solo los anillos. */
  #panel, #titulo { display: none; }
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<div id="titulo">J.A.R.V.I.S.</div>
<div id="panel"><div id="estado">CONECTANDO</div><div id="texto"></div></div>
<script>
"use strict";
const lienzo = document.getElementById("lienzo");
const ctx = lienzo.getContext("2d");
const etiqueta = document.getElementById("estado");
const caja = document.getElementById("texto");

const NOMBRES = { reposo: "EN ESPERA", escuchando: "ESCUCHANDO", pensando: "PROCESANDO",
                  hablando: "RESPONDIENDO" };
// Parámetros de cada estado; la animación se desliza suavemente de uno a otro.
const PERFILES = {
  reposo:     { giro: 0.15, brillo: 0.55, pulso: 0.04, barras: 0.0, orbitas: 0.0, tono: [79, 216, 255] },
  escuchando: { giro: 0.35, brillo: 0.85, pulso: 0.02, barras: 1.0, orbitas: 0.0, tono: [79, 216, 255] },
  pensando:   { giro: 0.70, brillo: 0.90, pulso: 0.06, barras: 0.0, orbitas: 1.0, tono: [255, 196, 87] },
  hablando:   { giro: 0.50, brillo: 1.00, pulso: 0.00, barras: 0.6, orbitas: 0.0, tono: [120, 230, 255] },
};

// Paleta fija de la nebulosa ("El Ojo de Dios" / Southern Ring, JWST):
// anillo de polvo ámbar/óxido por fuera, núcleo azul-blanco frío por
// dentro. Ninguno de los dos cambia con el estado — solo las estrellas
// (la central y las del fondo, ver más abajo) usan el color de PERFILES.
const TONO_ANILLO_ORO = [255, 196, 120];
const TONO_ANILLO_BRASA = [120, 56, 28];
const TONO_NUCLEO_FRIO = [150, 205, 255];

let estado = "reposo";
const actual = { ...PERFILES.reposo, tono: [...PERFILES.reposo.tono] };
let nivelMic = 0, nivelVoz = 0, angulo = 0;
// Ganancia automática: cada micrófono da niveles distintos, así que se resta el ruido de
// fondo y se divide por el pico reciente. El suelo de 0,12 evita amplificar el silencio.
let ruidoFondo = 0.05, picoReciente = 0.12;
function normalizarNivel(valor) {
  ruidoFondo = valor < ruidoFondo ? valor : ruidoFondo + (valor - ruidoFondo) * 0.002;
  picoReciente = Math.max(picoReciente * 0.995, valor, ruidoFondo + 0.12);
  return Math.max(0, valor - ruidoFondo) / (picoReciente - ruidoFondo);
}
const espectro = new Float32Array(96);

function conectar() {
  const fuente = new EventSource("/eventos");
  fuente.onmessage = (e) => {
    const evento = JSON.parse(e.data);
    if (evento.tipo === "estado") cambiarEstado(evento.estado, evento.texto);
    else if (evento.tipo === "nivel") nivelMic = Math.max(nivelMic, normalizarNivel(evento.valor));
  };
  fuente.onerror = () => { etiqueta.textContent = "SIN CONEXIÓN"; };
}

// En modo texto la respuesta no se pronuncia: se mantiene la animación de "hablando"
// un tiempo proporcional a su longitud antes de pasar al siguiente estado.
let hablarHasta = 0, pendiente = null;
function cambiarEstado(nuevo, texto) {
  const espera = hablarHasta - performance.now();
  clearTimeout(pendiente);
  if (nuevo !== "hablando" && espera > 0) {
    pendiente = setTimeout(() => cambiarEstado(nuevo, texto), espera);
    return;
  }
  estado = PERFILES[nuevo] ? nuevo : "reposo";
  etiqueta.textContent = NOMBRES[estado];
  caja.textContent = texto || "";
  hablarHasta = estado === "hablando"
    ? performance.now() + Math.min(8000, 1200 + 45 * (texto || "").length) : 0;
}

function ajustarTamano() {
  const r = window.devicePixelRatio || 1;
  lienzo.width = innerWidth * r;
  lienzo.height = innerHeight * r;
  ctx.setTransform(r, 0, 0, r, 0, 0);
}
addEventListener("resize", ajustarTamano);

const mezclar = (a, b, f) => a + (b - a) * f;
const color = (alfa) => `rgba(${actual.tono.map(Math.round).join(",")},${alfa})`;
// Interpola entre el oro del borde interior del anillo y la brasa de su
// borde exterior según qué tan afuera esté el jirón — así el anillo de
// polvo se ve como una gradiente continua, no un solo color plano.
const colorAnillo = (f, alfa) => {
  const c = [0, 1, 2].map((i) => mezclar(TONO_ANILLO_ORO[i], TONO_ANILLO_BRASA[i], f));
  return `rgba(${c.map(Math.round).join(",")},${alfa})`;
};
const colorNucleoFrio = (alfa) => `rgba(${TONO_NUCLEO_FRIO.join(",")},${alfa})`;

// Jirones de polvo: forman el anillo grueso de la nebulosa (banda entre
// 0,5 y 0,95 del radio, no un disco completo). "giro"/"orbitas" del perfil
// activo deciden qué tan rápido y caótico es el remolino; no hay dos
// jirones con la misma órbita ni fase, así que el anillo nunca se repite
// de forma visible aunque el estado se mantenga fijo un rato.
const N_JIRONES = 30;
const jirones = Array.from({ length: N_JIRONES }, (_, i) => ({
  radioBase: 0.5 + Math.random() * 0.45,
  anguloBase: Math.random() * Math.PI * 2,
  velocidad: 0.25 + Math.random() * 0.75,
  fase: Math.random() * Math.PI * 2,
  ondulacion: 0.08 + Math.random() * 0.14,
  tamano: 0.12 + Math.random() * 0.20,
  parpadeo: 0.6 + Math.random() * 1.8,
  sentido: i % 2 === 0 ? 1 : -1,
}));

// Estrellas de fondo: puntos pequeños y nítidos dispersos por fuera del
// anillo (como en la imagen de referencia), con su propio titileo. Son las
// que cambian de color con el estado de Jarvis — la nebulosa nunca cambia.
const N_ESTRELLAS = 30;
const estrellas = Array.from({ length: N_ESTRELLAS }, (_, i) => ({
  radioBase: 0.95 + Math.random() * 0.55,
  anguloBase: Math.random() * Math.PI * 2,
  velocidad: 0.1 + Math.random() * 0.3,
  fase: Math.random() * Math.PI * 2,
  tamano: 0.005 + Math.random() * 0.012,
  parpadeo: 1.2 + Math.random() * 3.2,
  sentido: i % 2 === 0 ? 1 : -1,
}));

let anterior = performance.now();
function dibujar(ahora) {
  const dt = Math.min(0.05, (ahora - anterior) / 1000);
  anterior = ahora;
  const t = ahora / 1000;

  // Transición suave hacia el perfil del estado actual.
  const meta = PERFILES[estado];
  const f = 1 - Math.pow(0.2, dt);
  for (const k of ["giro", "brillo", "pulso", "barras", "orbitas"]) actual[k] = mezclar(actual[k], meta[k], f);
  actual.tono = actual.tono.map((c, i) => mezclar(c, meta.tono[i], f));

  // Volumen: el del micrófono al escuchar; uno simulado al hablar (la voz del sistema no lo da).
  nivelMic *= Math.pow(0.04, dt);
  const vozMeta = estado === "hablando"
    ? 0.35 + 0.35 * Math.abs(Math.sin(t * 9.3) * Math.sin(t * 3.7 + 1)) + 0.2 * Math.random()
    : 0;
  nivelVoz = mezclar(nivelVoz, vozMeta, 1 - Math.pow(0.0005, dt));
  const energia = Math.max(nivelMic, nivelVoz);

  angulo += dt * actual.giro;
  const w = innerWidth, h = innerHeight;
  const R = Math.min(w, h) * 0.24;
  const respira = 1 + actual.pulso * Math.sin(t * 1.6) + energia * 0.06;
  const b = actual.brillo;
  // "pensando" agita la bruma (remolino más errático); el resto deriva en calma.
  const turbulencia = 1 + actual.orbitas * 0.6;

  // Estela ligera en lugar de borrar del todo, pero hacia transparente (no
  // hacia negro): flotando sobre el escritorio, un velo oscuro taparía lo
  // de atrás en vez de dejarlo transparente.
  ctx.globalCompositeOperation = "destination-out";
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.fillRect(0, 0, w, h);
  ctx.globalCompositeOperation = "source-over";

  ctx.save();
  ctx.translate(w / 2, h / 2 - h * 0.04);
  ctx.globalCompositeOperation = "lighter";

  // Si hay energía de voz/micrófono, la bruma reacciona ensanchándose por
  // pulsos en vez de con barras duras — más cónsono con niebla que con un
  // ecualizador. Reusa el mismo arreglo para promediar el ruido en el tiempo.
  for (let i = 0; i < espectro.length; i++) {
    const ruido = 0.5 + 0.5 * Math.sin(t * 7 + i * 0.9) * Math.sin(t * 2.3 + i * 0.37);
    espectro[i] = mezclar(espectro[i], energia * ruido, 0.25);
  }
  const pulsoAudio = actual.barras > 0.01
    ? espectro.reduce((s, v) => s + v, 0) / espectro.length
    : 0;

  // Núcleo: el interior frío y azulado de la nebulosa. Fijo en color;
  // respira de tamaño/brillo con el estado y la energía, igual que antes.
  const nucleo = R * 0.55 * respira;
  const halo = ctx.createRadialGradient(0, 0, 0, 0, 0, nucleo);
  halo.addColorStop(0, `rgba(255,255,255,${0.35 * b})`);
  halo.addColorStop(0.4, colorNucleoFrio(0.4 * b + energia * 0.2 + pulsoAudio * 0.2));
  halo.addColorStop(1, colorNucleoFrio(0));
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(0, 0, nucleo, 0, Math.PI * 2); ctx.fill();

  // Anillo de polvo: jirones ámbar/brasa en banda, fijo en color — solo se
  // mueven con el estado, nunca cambian de tono.
  for (const j of jirones) {
    const angJiron = j.anguloBase + angulo * j.velocidad * j.sentido * turbulencia
      + Math.sin(t * j.velocidad * 0.6 + j.fase) * j.ondulacion * turbulencia;
    const radioJiron = R * j.radioBase * (1 + 0.08 * Math.sin(t * j.velocidad + j.fase) + pulsoAudio * 0.12);
    const x = Math.cos(angJiron) * radioJiron;
    const y = Math.sin(angJiron) * radioJiron;
    const centelleo = 0.5 + 0.5 * Math.sin(t * j.parpadeo + j.fase);
    const radioBlob = R * j.tamano * respira * (0.85 + 0.3 * centelleo);
    const f = (j.radioBase - 0.5) / 0.45;
    const alfa = (0.55 + 0.35 * centelleo) * (0.6 + 0.4 * b);

    const blob = ctx.createRadialGradient(x, y, 0, x, y, radioBlob);
    blob.addColorStop(0, colorAnillo(f, alfa));
    blob.addColorStop(1, colorAnillo(f, 0));
    ctx.fillStyle = blob;
    ctx.beginPath(); ctx.arc(x, y, radioBlob, 0, Math.PI * 2); ctx.fill();
  }

  // Estrella central: el indicador principal del estado — su color sí
  // cambia (PERFILES.tono), con picos de difracción como en la referencia.
  const brazo = nucleo * (0.9 + 0.5 * energia);
  ctx.save();
  ctx.rotate(angulo * 0.15);
  ctx.strokeStyle = color(0.85 * b);
  ctx.lineWidth = 1.4;
  for (const [largo, ancho] of [[brazo, 1], [brazo * 0.42, Math.PI / 2]]) {
    ctx.beginPath();
    ctx.moveTo(Math.cos(ancho) * -largo, Math.sin(ancho) * -largo);
    ctx.lineTo(Math.cos(ancho) * largo, Math.sin(ancho) * largo);
    ctx.stroke();
  }
  ctx.restore();
  const centro = nucleo * 0.16 * (1 + 0.3 * energia);
  const brilloCentro = ctx.createRadialGradient(0, 0, 0, 0, 0, centro * 3);
  brilloCentro.addColorStop(0, `rgba(255,255,255,${0.9 * b})`);
  brilloCentro.addColorStop(0.3, color(0.7 * b));
  brilloCentro.addColorStop(1, color(0));
  ctx.fillStyle = brilloCentro;
  ctx.beginPath(); ctx.arc(0, 0, centro * 3, 0, Math.PI * 2); ctx.fill();

  // Estrellas de fondo: puntos nítidos dispersos fuera del anillo, también
  // con el color del estado — tenues y pequeñas, no compiten con la central.
  for (const e of estrellas) {
    const angEstrella = e.anguloBase + angulo * e.velocidad * e.sentido;
    const radioEstrella = R * e.radioBase;
    const x = Math.cos(angEstrella) * radioEstrella;
    const y = Math.sin(angEstrella) * radioEstrella;
    const centelleo = 0.5 + 0.5 * Math.sin(t * e.parpadeo + e.fase);
    const radioPunto = R * e.tamano * (0.6 + 0.6 * centelleo);
    const alfa = b * (0.3 + 0.55 * centelleo);

    const punto = ctx.createRadialGradient(x, y, 0, x, y, radioPunto * 3);
    punto.addColorStop(0, `rgba(255,255,255,${alfa})`);
    punto.addColorStop(0.35, color(alfa * 0.8));
    punto.addColorStop(1, color(0));
    ctx.fillStyle = punto;
    ctx.beginPath(); ctx.arc(x, y, radioPunto * 3, 0, Math.PI * 2); ctx.fill();
  }

  ctx.restore();

  etiqueta.style.color = color(1);
  requestAnimationFrame(dibujar);
}

ajustarTamano();
conectar();
requestAnimationFrame(dibujar);
</script>
</body>
</html>
