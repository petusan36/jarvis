<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Jarvis — Conexión con IA</title>
<style>
  :root { --cian: #7fe7ff; --fondo: #0b1016; --tarjeta: #141c26; --borde: #24323f; }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: #e8f4f8;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  body { display: flex; flex-direction: column; justify-content: center;
    align-items: center; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 18px; color: var(--cian); text-align: center; }
  p.ayuda { font-size: 13px; color: #9fb4c2; text-align: center; margin: 0 0 20px; line-height: 1.4; }
  .opciones { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; width: 100%; }
  button { background: var(--tarjeta); border: 1px solid var(--borde); color: #e8f4f8;
    border-radius: 10px; padding: 12px 18px; font-size: 14px; cursor: pointer; min-width: 140px; }
  button:hover { border-color: var(--cian); color: var(--cian); }
  button:disabled { opacity: 0.4; cursor: default; }
  .lista-modelos { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 360px;
    max-height: 260px; overflow-y: auto; }
  .lista-modelos button { width: 100%; text-align: left; }
  .lista-modelos button.elegido, .esfuerzo button.elegido { border-color: var(--cian); color: var(--cian); }
  .formulario { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 360px; }
  label { font-size: 13px; color: #9fb4c2; }
  .esfuerzo { display: flex; gap: 8px; }
  .esfuerzo button { flex: 1; min-width: 0; text-align: center; }
  #b-continuar { align-self: center; margin-top: 4px; }
  .spinner { width: 26px; height: 26px; border: 3px solid var(--borde); border-top-color: var(--cian);
    border-radius: 50%; animation: girar 1s linear infinite; margin: 0 auto 16px; }
  @keyframes girar { to { transform: rotate(360deg); } }
  .error { color: #ff8a8a; font-size: 13px; text-align: center; max-width: 380px; }
</style>
</head>
<body>
  <div id="app"><p class="ayuda">Cargando…</p></div>

<script>
const TOKEN = "__JARVIS_TOKEN__";

async function elegir(accion) {
  await fetch("/accion", {
    method: "POST",
    headers: { "X-Jarvis-Token": TOKEN },
    body: JSON.stringify(accion),
  });
}

let pasoRenderizado = null;

function render(estado) {
  const app = document.getElementById("app");
  const paso = estado.paso || "inicio";
  // Sin esto, cada poll (cada 400ms) reconstruye el HTML entero y borra lo
  // que el usuario esté escribiendo en el campo de modelo del paso
  // "modelo_esfuerzo" — un re-render de más ahí resetea el formulario a
  // mitad de tipeo. Mismo paso que el anterior: no hay nada nuevo que
  // mostrar, así que no se toca el DOM.
  if (paso === pasoRenderizado) return;
  pasoRenderizado = paso;

  if (paso === "inicio") {
    app.innerHTML = `
      <h1>¿Cómo querés conectar con un modelo de IA?</h1>
      <div class="opciones">
        <button id="b-local">Modelo local (Ollama)</button>
        <button id="b-proveedor">Proveedor en la nube</button>
      </div>`;
    document.getElementById("b-local").onclick = () => elegir({ tipo: "local" });
    document.getElementById("b-proveedor").onclick = () => elegir({ tipo: "proveedor" });
    return;
  }

  if (paso === "local") {
    const modelos = estado.modelos || [];
    const botones = modelos.map((m, i) =>
      `<button data-modelo="${i}">${m}</button>`).join("");
    app.innerHTML = `
      <h1>Elegí un modelo local</h1>
      <div class="lista-modelos">${botones}</div>`;
    [...app.querySelectorAll("[data-modelo]")].forEach((boton, i) => {
      boton.onclick = () => elegir({ tipo: "modelo", modelo: modelos[i] });
    });
    return;
  }

  if (paso === "proveedor") {
    app.innerHTML = `
      <h1>¿Qué proveedor en la nube?</h1>
      <div class="opciones">
        <button id="b-openai">OpenAI (Codex)</button>
        <button id="b-anthropic">Anthropic (Claude)</button>
      </div>`;
    document.getElementById("b-openai").onclick = () => elegir({ tipo: "openai" });
    document.getElementById("b-anthropic").onclick = () => elegir({ tipo: "anthropic" });
    return;
  }

  if (paso === "modelo_esfuerzo") {
    const modeloActual = estado.modelo_actual || "";
    const modelos = estado.modelos || null;
    // Con lista cerrada (Claude): elegir por botón, nunca texto libre —
    // Codex (modelos=null) solo acepta un modelo interno fijo por cuenta,
    // así que ahí ni se ofrece elegir (ver _atender_modelo_esfuerzo_ventana).
    const seccionModelo = modelos
      ? `<div>
          <label>Modelo</label>
          <div class="lista-modelos">${modelos.map((m) =>
            `<button data-modelo="${m}" class="${m === modeloActual ? "elegido" : ""}">${m}${m === modeloActual ? " (actual)" : ""}</button>`
          ).join("")}</div>
        </div>`
      : `<p class="ayuda">Modelo fijo para ${estado.nombre || "este proveedor"}: <strong>${modeloActual}</strong></p>`;
    app.innerHTML = `
      <h1>${estado.nombre || "Proveedor"}: modelo y esfuerzo</h1>
      <div class="formulario">
        ${seccionModelo}
        <div>
          <label>Nivel de esfuerzo</label>
          <div class="esfuerzo">
            <button data-esfuerzo="low" class="elegido">low</button>
            <button data-esfuerzo="medium">medium</button>
            <button data-esfuerzo="high">high</button>
          </div>
        </div>
        <button id="b-continuar">Continuar</button>
      </div>`;
    let modeloElegido = modeloActual;
    if (modelos) {
      const botonesModelo = [...app.querySelectorAll("[data-modelo]")];
      botonesModelo.forEach((boton) => {
        boton.onclick = () => {
          modeloElegido = boton.dataset.modelo;
          botonesModelo.forEach((b) => b.classList.toggle("elegido", b === boton));
        };
      });
    }
    let esfuerzoElegido = "low";
    const botonesEsfuerzo = [...app.querySelectorAll("[data-esfuerzo]")];
    botonesEsfuerzo.forEach((boton) => {
      boton.onclick = () => {
        esfuerzoElegido = boton.dataset.esfuerzo;
        botonesEsfuerzo.forEach((b) => b.classList.toggle("elegido", b === boton));
      };
    });
    document.getElementById("b-continuar").onclick = () => elegir({
      tipo: "modelo_esfuerzo",
      modelo: modeloElegido,
      esfuerzo: esfuerzoElegido,
    });
    return;
  }

  if (paso === "esperando_login") {
    app.innerHTML = `
      <div class="spinner"></div>
      <p class="ayuda">${estado.mensaje || "Esperando que termines de iniciar sesión…"}</p>`;
    return;
  }

  if (paso === "hecho") {
    app.innerHTML = `<p class="ayuda">${estado.mensaje || "Listo."}</p>`;
    return;
  }

  if (paso === "error") {
    app.innerHTML = `<p class="error">${estado.mensaje || "Algo salió mal."}</p>`;
    return;
  }

  app.innerHTML = `<p class="ayuda">Cargando…</p>`;
}

async function pollear() {
  try {
    const resp = await fetch("/estado");
    render(await resp.json());
  } catch (_e) {
    // la ventana se está cerrando: el servidor ya no responde, no pasa nada
  }
  setTimeout(pollear, 400);
}

pollear();
</script>
</body>
</html>
