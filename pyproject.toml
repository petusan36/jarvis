[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Asistente personal por voz inspirado en el Jarvis de Iron Man, con Claude como cerebro."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"  # Kokoro (voz) todavía no soporta 3.13+
dependencies = [
    "anthropic>=1.0",
    "claude-agent-sdk>=0.2",
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    "numpy>=1.24",
    "pyttsx3>=2.90",
    "piper-tts>=1.3",
    "kokoro>=0.9.4",
    "soundfile>=0.12",
    "pypdf>=5.0",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit>=10.0; sys_platform == 'darwin'",
    "graphiti-core>=0.30.2",
    "ladybug>=0.21.2",  # ex-Kuzu (LadybugDB): grafo+vectores embebido, sin servidor
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
"jarvis.hud" = ["*.html"]
