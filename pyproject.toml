[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Asistente personal por voz inspirado en el Jarvis de Iron Man, con Claude como cerebro."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["anthropic>=1.0"]

[project.optional-dependencies]
suscripcion = ["claude-agent-sdk>=0.2"]
voz = ["faster-whisper>=1.0", "sounddevice>=0.4", "numpy>=1.24", "pyttsx3>=2.90"]
voz-natural = ["piper-tts>=1.3"]
voz-kokoro = ["kokoro>=0.9.4", "soundfile>=0.12"]
dev = ["pytest>=8"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
"jarvis.hud" = ["*.html"]
